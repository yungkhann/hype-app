<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CQA Studio</title>
    <link rel="stylesheet" href="css/app.css?v=sat2" />
  </head>
  <body>
    <div class="app">
      <aside class="rail" aria-label="Primary">
        <a class="brand" href="#/">
          <span class="logo" aria-hidden="true">II</span>
          <span class="brand-name">CQA Studio</span>
        </a>
        <nav class="nav">
          <a class="nav-link" data-nav="list" href="#/">
            <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1Z"/></svg>
            Home
          </a>
          <a class="nav-link" data-nav="checklist" href="#/checklist">
            <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
            Checklist
          </a>
          <a class="nav-link" data-nav="review" href="#/review">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3V5Z"/></svg>
            Appeals
          </a>
          <p class="nav-label">Pinned</p>
          <a class="nav-link" href="#/c/conv-01">
            <svg viewBox="0 0 24 24"><path d="M8 5h8a2 2 0 0 1 2 2v12l-6-3-6 3V7a2 2 0 0 1 2-2Z"/></svg>
            Demo conversation
          </a>
        </nav>
        <div class="rail-foot">
          <div class="invite">
            <strong>Freedom Broker</strong>
            <p>Conversation quality analytics. 65 lines, three languages.</p>
          </div>
          <label class="field-label" for="group-id">group_id</label>
          <input id="group-id" class="input" type="text" value="dev" autocomplete="off" />
          <button type="button" class="btn" id="btn-fetch">Load API</button>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span class="crumb" id="crumb">Home</span>
          <label class="top-search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
            <input data-filter="q" type="search" placeholder="Search everything…" />
            <kbd>⌘K</kbd>
          </label>
          <div class="topbar-right">
            <button type="button" class="btn" data-action="reset">Reset</button>
            <a class="btn btn-primary" href="#/checklist">Create</a>
          </div>
        </header>
        <main id="view" class="view"></main>
      </div>
    </div>
    <script type="module" src="js/app.js?v=el4"></script>
  </body>
</html>
