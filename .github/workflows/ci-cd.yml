# CI: every push and pull request runs the checks on a GitHub-hosted Linux machine.
# CD: a push to main that passes the checks is deployed by the self-hosted runner on the Windows PC
#     that runs Docker and the Cloudflare Tunnel (https://lumvy.io).
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main midway through a deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt

      - name: Install API dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: API tests
        working-directory: apps/api
        run: python -m pytest -q

      - name: Frontend JS syntax check
        run: for f in apps/web/js/*.js; do node --check "$f"; done

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build web api

  deploy:
    name: Deploy to lumvy.io
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      # The clone on the server PC that docker compose runs from. It holds .env (tunnel token) and data/.
      DEPLOY_DIR: C:\Users\yerna\dev\hype-app
    defaults:
      run:
        shell: powershell
    steps:
      - name: Update the server's clone to this commit
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location $env:DEPLOY_DIR
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git merge --ff-only $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { Write-Error "Fast-forward failed: the server clone has local commits or changes."; exit 1 }
          git log --oneline -1

      - name: Rebuild and restart web and api
        run: |
          $ErrorActionPreference = 'Continue'
          Set-Location $env:DEPLOY_DIR
          docker compose up -d --build --remove-orphans web api
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Make sure the tunnel is running too (no-op when it already is).
          docker compose --profile public up -d tunnel
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker image prune -f | Out-Null

      - name: Health check
        run: |
          $ErrorActionPreference = 'Stop'
          $checks = @('http://127.0.0.1:3000/', 'http://127.0.0.1:8000/docs', 'https://lumvy.io/')
          foreach ($url in $checks) {
            $ok = $false
            for ($i = 1; $i -le 12 -and -not $ok; $i++) {
              try {
                $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
                if ($r.StatusCode -eq 200) { $ok = $true }
              } catch { Start-Sleep -Seconds 5 }
            }
            if (-not $ok) { throw "Health check failed: $url" }
            Write-Host "OK  $url"
          }
