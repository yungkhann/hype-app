# nginx config for the web container.
# - Normal traffic (https://lumvy.io): the static frontend.
# - https://lumvy.io/api/v1/...: proxied to the ATLAS API (the compose "api" service), so the browser stays same-origin.
# - Traffic on port 8443 (https://lumvy.io:8443): Ollama running on the host PC. Status and generation are open
#   to anyone (no key); model management (pull, push, create, copy, delete) is blocked.
#   The Cloudflare Tunnel delivers both to this container on port 80; the browser's Host header keeps ":8443".

map $http_host $via_ollama_port {
    default    0;
    "~:8443$"  1;
}

# Which Ollama requests are allowed from the internet: status + generation. No pull, push, create, copy or delete.
map "$via_ollama_port $request_method $uri" $ollama_route {
    default                                                                          "";
    "~^1 (GET|HEAD) (/|/api/version|/api/tags|/api/ps|/v1/models)$"                  allow;
    "~^1 POST (/api/generate|/api/chat|/api/embed|/api/embeddings|/api/show)$"       allow;
    "~^1 POST (/v1/chat/completions|/v1/completions|/v1/embeddings)$"                allow;
    "~^1 "                                                                           deny;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Docker's embedded DNS. Resolving "api" per request (via the variable below) survives the api container being
    # recreated with a new IP, and lets this container start before the api does.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/v1/ {
        # The Ollama port (8443) never reaches the ATLAS API.
        if ($via_ollama_port) {
            return 403 "Not allowed.\n";
        }
        set $atlas_api http://api:8000;
        proxy_pass $atlas_api;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Dataset uploads (ATLAS_MAX_UPLOAD_MB) and slow model evaluations.
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        if ($ollama_route = deny) {
            return 403 "Not allowed. Open: GET /, /api/version, /api/tags, /api/ps, /v1/models; POST /api/generate, /api/chat, /api/embed, /api/show, /v1/chat/completions, /v1/completions, /v1/embeddings\n";
        }
        if ($ollama_route = allow) {
            rewrite ^ /__ollama$uri last;
        }
        try_files $uri $uri/ =404;
    }

    location ^~ /__ollama/ {
        internal;
        rewrite ^/__ollama(/.*)$ $1 break;
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host localhost:11434;
        proxy_set_header Origin "";
        proxy_http_version 1.1;
        # Stream tokens as they are generated, and allow long generations.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
        default_type application/json;
    }
}
