# nginx config for the web container.
# - Normal traffic (https://lumvy.io): the static frontend.
# - Traffic on port 8443 (https://lumvy.io:8443): Ollama running on the host PC, read-only status endpoints only.
#   The Cloudflare Tunnel delivers both to this container on port 80; the browser's Host header keeps ":8443".

map $http_host $via_ollama_port {
    default    0;
    "~:8443$"  1;
}

# Which Ollama requests are allowed from the internet: status only, no generation, pull or delete.
map "$via_ollama_port $request_method $uri" $ollama_route {
    default                                                      "";
    "~^1 (GET|HEAD) (/|/api/version|/api/tags|/api/ps)$"         allow;
    "~^1 "                                                       deny;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        if ($ollama_route = deny) {
            return 403 "Only status endpoints are open: /, /api/version, /api/tags, /api/ps\n";
        }
        if ($ollama_route = allow) {
            rewrite ^ /__ollama$uri last;
        }
        try_files $uri $uri/ =404;
    }

    location ^~ /__ollama/ {
        internal;
        rewrite ^/__ollama(/.*)$ $1 break;
        proxy_pass http://host.docker.internal:11434;
        proxy_set_header Host localhost:11434;
        proxy_set_header Origin "";
        proxy_read_timeout 30s;
        default_type application/json;
    }
}
