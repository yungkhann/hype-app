# Run the whole app:   docker compose up --build -d
# Local:   web http://127.0.0.1:3000    API http://127.0.0.1:8000/docs
# Public:  set CLOUDFLARE_TUNNEL_TOKEN in .env, then  docker compose --profile public up --build -d
#          The tunnel serves the app on your domain (e.g. https://lumvy.io) with no open router ports.
# Local ports are published on 127.0.0.1 only; public traffic goes only through the tunnel.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${ATLAS_WEB_PORT:-3000}:80"
    extra_hosts:
      # https://lumvy.io:8443 is proxied to Ollama on the host (docker/nginx-web.conf).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:${ATLAS_API_PORT:-8000}:8000"
    environment:
      ATLAS_CORS_ORIGINS: '["http://localhost:${ATLAS_WEB_PORT:-3000}","http://127.0.0.1:${ATLAS_WEB_PORT:-3000}","https://${PUBLIC_DOMAIN:-lumvy.io}","https://www.${PUBLIC_DOMAIN:-lumvy.io}"]'
      ATLAS_ALLOWED_HOSTS: '["127.0.0.1","localhost","api","api.${PUBLIC_DOMAIN:-lumvy.io}"]'
      ATLAS_MAX_UPLOAD_MB: ${ATLAS_MAX_UPLOAD_MB:-500}
      # Ollama runs on the host PC (not in Docker). Both URLs reach it from inside this container.
      OLLAMA_BASE_URL: http://localhost:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/workspaces:/data/workspaces
    restart: unless-stopped

  # Port forward: localhost:11434 inside the api container -> Ollama on the host (host.docker.internal:11434).
  # Shares the api container's network, so the api code can call http://localhost:11434 as on the host.
  ollama-forward:
    image: alpine/socat:1.8.0.3
    command: TCP-LISTEN:11434,fork,reuseaddr TCP:host.docker.internal:11434
    network_mode: "service:api"
    depends_on:
      - api
    restart: unless-stopped

  # Cloudflare Tunnel. Routes (lumvy.io -> http://web:80, api.lumvy.io -> http://api:8000)
  # are set in the Cloudflare dashboard on the tunnel's "Public Hostname" tab.
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
      - api
    restart: unless-stopped
    profiles: ["public"]
